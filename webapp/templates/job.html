{% extends "base.html" %}
{% block title %}Job {{ job_id }} — Dubai Real Estate Toolkit{% endblock %}
{% block content %}

<div class="card">
  <h2 style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
    <span>Job <code>{{ job_id }}</code></span>
    <span id="badge" class="status-badge status-running">running</span>
  </h2>
  <pre class="log" id="log"></pre>
  <div id="actions"></div>
  <p><a href="{{ url_for('dashboard') }}" class="btn btn-secondary">&larr; Back to dashboard</a></p>
</div>

<script>
const jobId = {{ job_id | tojson }};
const logEl = document.getElementById('log');
const badgeEl = document.getElementById('badge');
const actionsEl = document.getElementById('actions');

let missCount = 0;

async function poll() {
  let res, data;
  try {
    res = await fetch(`/jobs/${jobId}/status`);
    data = await res.json();
  } catch (e) {
    setTimeout(poll, 2000);
    return;
  }

  if (!res.ok || !data || data.error === 'not found') {
    missCount++;
    // A couple of misses in a row means the server process restarted
    // (most likely it ran out of memory) and lost this job's state.
    if (missCount >= 2) {
      badgeEl.textContent = 'lost';
      badgeEl.className = 'status-badge status-error';
      actionsEl.innerHTML = `<p class="flash">The server restarted before this job finished — most likely it ran out of memory (common on Render's free tier when Chromium loads a heavy page). Try again; if it keeps happening, this job may need more RAM than the free plan gives it.</p>`;
      return;
    }
    setTimeout(poll, 2000);
    return;
  }
  missCount = 0;

  logEl.textContent = data.logs.join('\n');
  logEl.scrollTop = logEl.scrollHeight;

  badgeEl.textContent = data.status;
  badgeEl.className = 'status-badge status-' + data.status;

  if (data.status === 'done') {
    actionsEl.innerHTML = `<a class="btn" href="/jobs/${jobId}/download">Download Result</a>`;
    return;
  }
  if (data.status === 'error') {
    actionsEl.innerHTML = `<p class="flash">${data.error || 'Job failed.'}</p>`;
    return;
  }
  setTimeout(poll, 1500);
}
poll();
</script>
{% endblock %}
