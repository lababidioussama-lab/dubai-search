<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Dubai Real Estate Toolkit{% endblock %}</title>
<style>
  :root {
    --navy: #1F4E78;
    --blue: #2E75B6;
    --gold: #C9A227;
    --light: #F2F6FC;
    --border: #D9E2EC;
    --text: #1B2733;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--light);
    color: var(--text);
  }
  header {
    background: linear-gradient(90deg, var(--navy), var(--blue));
    color: #fff;
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: 0.3px;
  }
  header a {
    color: #fff;
    opacity: 0.85;
    text-decoration: none;
    font-size: 14px;
  }
  header a:hover { opacity: 1; }
  main {
    max-width: 760px;
    margin: 40px auto;
    padding: 0 20px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px 32px;
    margin-bottom: 24px;
    box-shadow: 0 1px 3px rgba(31, 78, 120, 0.08);
  }
  .card h2 {
    margin-top: 0;
    color: var(--navy);
    font-size: 17px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--navy);
    margin: 14px 0 4px;
  }
  input[type=text], input[type=number], input[type=password], input[type=file], select {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
  }
  button, .btn {
    background: var(--gold);
    color: #1B2733;
    border: none;
    padding: 11px 22px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    margin-top: 18px;
    display: inline-block;
    text-decoration: none;
  }
  button:hover, .btn:hover { opacity: 0.9; }
  .btn-secondary {
    background: var(--blue);
    color: #fff;
  }
  .muted { color: #64748B; font-size: 13px; }
  .flash {
    background: #FDECEC;
    border: 1px solid #F5B5B5;
    color: #8A1F1F;
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 14px;
  }
  pre.log {
    background: #0D1B2A;
    color: #9FE870;
    padding: 16px;
    border-radius: 8px;
    height: 320px;
    overflow-y: auto;
    font-size: 12.5px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .status-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
  }
  .status-running { background: #FFF3CD; color: #8A6D00; }
  .status-done { background: #DFF5E1; color: #1F7A3D; }
  .status-error { background: #FDECEC; color: #8A1F1F; }
</style>
</head>
<body>
<header>
  <h1>Dubai Real Estate Toolkit</h1>
  {% if session.get('authed') %}<a href="{{ url_for('logout') }}">Log out</a>{% endif %}
</header>
<main>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
