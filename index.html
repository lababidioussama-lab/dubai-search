<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAMAC Lagoons — Interactive 3D Villa Map</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050505'/%3E%3Crect x='9' y='9' width='14' height='14' fill='none' stroke='%23ff0033' stroke-width='3'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene-canvas"></canvas>

      <div id="hud">
        <div id="hud-title">
          <span class="hud-title-main">DAMAC LAGOONS</span>
          <span class="hud-title-sub">Portofino — live plot map</span>
        </div>

        <div id="search-panel">
          <div id="search-box">
            <svg id="search-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path
                d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              />
            </svg>
            <input
              id="search-input"
              type="text"
              placeholder="Search plot number, e.g. BL105"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <div id="search-status" aria-live="polite"></div>
          <div id="search-results"></div>
        </div>

        <div id="coverage-note">
          <strong id="coverage-count">0</strong> plots mapped in this preview —
          Portofino lagoon frontage only. See STATUS.md for full coverage plan.
        </div>
      </div>

      <div id="callout" class="hidden">
        <div id="callout-leader"></div>
        <div id="callout-card">
          <div id="callout-id"></div>
          <div id="callout-meta"></div>
          <div id="callout-confirm">✓ Located</div>
        </div>
      </div>

      <div id="loading">Loading Portofino…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
